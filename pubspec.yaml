name: flutter_chromium
description: Flutter Desktop WebView backed by Chromium (CEF).
version: 0.3.0
homepage: https://dip.dev
repository: https://github.com/dip-develop/flutter-chromium
issue_tracker: https://github.com/dip-develop/flutter-chromium/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FlutterChromiumPlugin
      windows:
        pluginClass: FlutterChromiumPluginCApi
      linux:
        pluginClass: FlutterChromiumPlugin
